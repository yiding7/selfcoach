[project]
name = "health-assistant"
version = "0.1.0"
description = "健身教练 / 营养师 / 健康顾问 一体化 AI 工具 —— 模型无关，即启即用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# 运行时零依赖，全部使用 Python 标准库。
# 这不是疏漏，是设计目标：clone 下来就能跑，不需要 pip install 任何东西。
dependencies = []

[project.scripts]
hc = "health_assistant.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
